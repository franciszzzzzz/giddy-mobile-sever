name: Deploy Backend to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            cd ~/giddy-mobile-sever

            echo "Pulling latest code..."
            # Hard reset instead of pull so hand-edits on the VM can never
            # block a deploy. Untracked files (e.g. config/.env) are safe —
            # reset never touches them. Do NOT add git clean here.
            git fetch origin main
            git reset --hard origin/main

            echo "Building and restarting services..."
            # No service arg so compose also picks up config changes on other
            # services (e.g. redis command/maxmemory-policy) — recreating the
            # redis container is safe: data persists via the redis-data volume (AOF).
            docker compose up -d --build

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "Waiting for backend to become healthy..."

            for i in {1..30}; do
              if curl -fs http://127.0.0.1:8000/api/v1/health > /dev/null; then
                echo "✅ Backend is healthy!"
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "❌ Backend failed to become healthy."
                docker compose logs backend --tail=100
                exit 1
              fi

              echo "Attempt $i/30: waiting 2 seconds..."
              sleep 2
            done

            echo "Running final health check..."
            curl -f http://127.0.0.1:8000/api/v1/health

            echo "🎉 Deployment successful!"
